name: CI lints and tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_VERSION: 0.8.1
  SCCACHE_SHA256: "7203a4dcb3a67f3a0272366d50ede22e5faa3e2a798deaa4d1ea377b51c0ab0c"
  SCCACHE_DIR: /home/runner/.cache/sccache
  SCCACHE_PREFIX: pg_fusion-rust-cache
  RUST_TOOLCHAIN_VERSION: 1.96.0
  PGRX_VERSION: 0.18.1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [ 17 ]
    env:
      PG_MAJOR: ${{ matrix.postgres }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up sccache
        run: |
          wget https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v${{env.SCCACHE_VERSION}}-x86_64-unknown-linux-musl.tar.gz
          tar -xzf sccache-v${{env.SCCACHE_VERSION}}-x86_64-unknown-linux-musl.tar.gz
          sudo mv sccache-v${{env.SCCACHE_VERSION}}-x86_64-unknown-linux-musl/sccache /usr/local/bin
          chmod +x /usr/local/bin/sccache
          echo "${{env.SCCACHE_SHA256}}  /usr/local/bin/sccache" | sha256sum --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{env.SCCACHE_PREFIX}}-${{ runner.os }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yaml') }}

      - name: Cache sccache directory
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{env.SCCACHE_PREFIX}}-${{ runner.os }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yaml') }}

      - name: Install PostgreSQL
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get -y install build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev \
                                  libxslt-dev libssl-dev libxml2-utils xsltproc ccache pkg-config   \
                                  gnupg ca-certificates
          sudo apt-get -y install postgresql-${{ env.PG_MAJOR }}-postgis-3 \
                                  postgresql-server-dev-${{ env.PG_MAJOR }} \
                                  postgresql-client-${{ env.PG_MAJOR }} \
                                  libpq-dev

      - name: Install and configure pgrx
        run: |
          cargo install --locked cargo-pgrx@${{ env.PGRX_VERSION }}
          cargo pgrx init --pg${{ env.PG_MAJOR }} /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin/pg_config

      - name: Install cargo-llvm-cov for coverage report
        run: cargo install --locked cargo-llvm-cov@0.6.12

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --features "pg${{ env.PG_MAJOR }}, pg_test" --no-default-features


      - name: Set up permissions for PostgreSQL
        run: |
          sudo chmod a+rwx $(/usr/lib/postgresql/${{ env.PG_MAJOR }}/bin/pg_config --pkglibdir)          \
                           $(/usr/lib/postgresql/${{ env.PG_MAJOR }}/bin/pg_config --sharedir)/extension \
                           /var/run/postgresql/

      - name: Run pg_test pgrx coverage tests
        working-directory: .
        run: |
          # Run PostgreSQL-bound test crate with coverage inside pgrx/PostgreSQL.
          LLVM_COV_ENV=$(mktemp)
          cargo llvm-cov show-env --export-prefix > "$LLVM_COV_ENV"
          source "$LLVM_COV_ENV"
          cargo llvm-cov clean
          cargo pgrx test pg${{ env.PG_MAJOR }} -p pg_test --no-default-features
          cargo llvm-cov report --lcov --output-path pgrx_lcov.info

      - name: Run pg_fusion SQL smoke tests
        working-directory: .
        run: |
          PG_BIN="/usr/lib/postgresql/${{ env.PG_MAJOR }}/bin"
          PGDATA="$(mktemp -d)"
          PORT=55432

          cleanup() {
            "$PG_BIN/pg_ctl" -D "$PGDATA" -m fast -w stop || true
            rm -rf "$PGDATA"
          }
          trap cleanup EXIT

          cargo pgrx install \
            --pg-config "$PG_BIN/pg_config" \
            -p pg_fusion \
            --no-default-features \
            --features "pg${{ env.PG_MAJOR }} pg_test"

          "$PG_BIN/initdb" -D "$PGDATA" -A trust -U postgres --locale=C --encoding=UTF8
          cat >> "$PGDATA/postgresql.conf" <<EOF
          shared_preload_libraries = 'pg_fusion'
          pg_fusion.worker_memory_limit_mb = 128
          listen_addresses = '127.0.0.1'
          port = $PORT
          unix_socket_directories = '/tmp'
          EOF
          "$PG_BIN/pg_ctl" -D "$PGDATA" -l "$PGDATA/postgres.log" -w start || {
            cat "$PGDATA/postgres.log"
            exit 1
          }

          "$PG_BIN/psql" \
            -h 127.0.0.1 \
            -p "$PORT" \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION pg_fusion;

          SELECT 1 / CASE
            WHEN current_setting('shared_preload_libraries') = 'pg_fusion'
            THEN 1 ELSE 0
          END AS shared_preload_ok;

          SET pg_fusion.enable = on;
          SELECT 1 / CASE WHEN (SELECT 1::bigint) = 1 THEN 1 ELSE 0 END AS simple_select_ok;

          BEGIN;
          SET LOCAL pg_fusion.enable = off;
          CREATE TEMP TABLE pgf_spill_metrics_smoke AS
            SELECT g::int AS k, repeat(md5(g::text), 8) AS payload
            FROM generate_series(1, 200000) AS g;
          SET LOCAL pg_fusion.enable = on;
          CREATE TEMP TABLE pgf_spill_epoch AS
            SELECT pg_fusion_metrics_reset() AS epoch;

          SELECT 1 / CASE
            WHEN (
              SELECT max(rn)::bigint
              FROM (
                SELECT row_number() OVER (ORDER BY payload) AS rn
                FROM pgf_spill_metrics_smoke
              ) AS ordered_src
            ) = 200000
            THEN 1 ELSE 0
          END AS spill_query_ok;

          WITH summary AS (
            SELECT
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_count_total'), 0) AS spill_count,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spilled_rows_total'), 0) AS spilled_rows,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spilled_bytes_total'), 0) AS spilled_bytes,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_dirs_created_total'), 0) AS dirs_created,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_dirs_removed_total'), 0) AS dirs_removed,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_leaked_files_total'), 0) AS leaked_files,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_leaked_bytes_total'), 0) AS leaked_bytes,
              coalesce(max(value) FILTER (WHERE metric = 'worker_spill_cleanup_errors_total'), 0) AS cleanup_errors,
              coalesce(max(reset_epoch), 0) AS reset_epoch
            FROM pg_fusion_metrics()
          )
          SELECT 1 / CASE
            WHEN spill_count > 0
              AND spilled_rows > 0
              AND spilled_bytes > 0
              AND dirs_created > 0
              AND dirs_removed > 0
              AND leaked_files = 0
              AND leaked_bytes = 0
              AND cleanup_errors = 0
              AND reset_epoch = (SELECT epoch FROM pgf_spill_epoch)
            THEN 1 ELSE 0
          END AS spill_metrics_ok
          FROM summary;
          ROLLBACK;
          SQL

      - name: Upload pgrx coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          files: ./pgrx_lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run library coverage
        working-directory: .
        run: |
          # Run all non-extension crates with coverage
          LLVM_COV_ENV=$(mktemp)
          cargo llvm-cov show-env --export-prefix > "$LLVM_COV_ENV"
          source "$LLVM_COV_ENV"
          cargo llvm-cov clean
          cargo llvm-cov --workspace \
            --exclude backend_service \
            --exclude df_catalog \
            --exclude pg_fusion \
            --exclude pg_test \
            --exclude plan_builder \
            --exclude row_estimator_seed \
            --exclude slot_encoder \
            --exclude slot_import \
            --exclude slot_scan \
            --lcov --output-path core_lcov.info

      - name: Upload core coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          files: ./core_lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
